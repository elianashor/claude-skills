name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  FORCE_COLOR: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  quality:
    name: lint, format, skills, vendored scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: skills, plugin manifests and marketplace
        run: pincite lint --strict
      - name: vendored scripts match src/
        run: python tools/sync_scripts.py --check
      - name: wheel and sdist build
        run: python -m build

  confidentiality:
    name: confidentiality guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan every commit, not just the tip: history leaks too
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: scan working tree and full history
        env:
          # One private term per line, stored as a repository secret. Never commit it.
          PINCITE_DENYLIST: ${{ secrets.PINCITE_DENYLIST }}
        run: |
          if [ -z "$PINCITE_DENYLIST" ]; then
            echo "::warning title=Confidentiality guard::PINCITE_DENYLIST secret is not set; only built-in patterns are checked."
          fi
          pincite guard --mask
          pincite guard --mask --history

  bundles:
    name: skill bundles
    runs-on: ubuntu-latest
    needs: [test, quality]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/bundle.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: skill-bundles
          path: dist/
