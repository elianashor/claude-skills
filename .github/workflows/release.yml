name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.0.0"
        required: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: tag, package and plugin versions agree
        run: |
          python - <<'PY'
          import json, os, re, sys, pathlib
          tag = os.environ["TAG"].lstrip("v")
          pkg = re.search(r'__version__ = "(.+?)"', pathlib.Path("src/pincite/__init__.py").read_text()).group(1)
          plugins = {p.parent.parent.name: json.loads(p.read_text())["version"]
                     for p in pathlib.Path("plugins").glob("*/.claude-plugin/plugin.json")}
          bad = {k: v for k, v in {"pincite": pkg, **plugins}.items() if v != tag}
          if bad:
              sys.exit(f"version mismatch with tag v{tag}: {bad}")
          print(f"all versions are {tag}")
          PY
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: pincite lint --strict
      - run: python -m build --outdir dist/python
      - run: python tools/bundle.py --out dist
      - name: release notes from CHANGELOG
        run: |
          python - <<'PY' > dist/NOTES.md
          import os, pathlib, re
          v = os.environ["TAG"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(rf"^## \[?{re.escape(v)}\]?.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          print((m.group(1).strip() if m else f"Release {v}") + "\n\nVerify downloads against SHA256SUMS.")
          PY
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          files="dist/skills/*.zip dist/plugins/*.zip dist/python/* dist/SHA256SUMS"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $files --title "$TAG" --notes-file dist/NOTES.md --repo "$GITHUB_REPOSITORY"
          fi

  pypi:
    # Off until the owner sets the repository variable PUBLISH_TO_PYPI=true and
    # registers this workflow as a trusted publisher on PyPI. No token is stored.
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python
